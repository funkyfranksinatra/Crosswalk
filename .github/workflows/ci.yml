name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      COMPANY_NAME: Medtronic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
      - name: Seed without reference data (must not fail)
        run: npx tsx prisma/seed.ts
      - name: Unit checks (heuristic binner + similarity)
        run: npx tsx scripts/check.ts
